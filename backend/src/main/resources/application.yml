# SchemaForge configuration.
# Every secret comes from the environment. Nothing sensitive is committed here.
# For local development, run with SPRING_PROFILES_ACTIVE=dev (see application-dev.yml).

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/migration_db}
    username: ${DB_USER:migration_user}
    password: ${DB_PASS:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    com.schemaforge: ${LOG_LEVEL:INFO}
  file:
    name: ${LOG_FILE:logs/schemaforge.log}

schemaforge:
  jwt:
    # Required. HS256 signing key of at least 32 bytes; the app refuses to start without it.
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT24H}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  connections:
    # Optional comma-separated allowlist of database hosts (exact names or IP literals).
    # Leave empty to allow any host except link-local and cloud-metadata addresses.
    allowed-hosts: ${ALLOWED_DB_HOSTS:}
  rate-limit:
    # Requests per minute per client IP for login and register.
    auth-per-minute: ${AUTH_RATE_LIMIT:10}
